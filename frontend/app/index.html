<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="HoodFolio — Robinhood Chain portfolio dashboard">
    <meta name="author" content="HoodFolio">
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/hoodfolio-logo.png">
    <link rel="icon" type="image/png" href="/hoodfolio-logo.png">
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials">
    <meta property="og:title" content="HoodFolio">
    <meta property="og:description" content="Robinhood Chain portfolio dashboard">
    <meta property="og:url" content="https://hoodfolio.online">
    <meta property="og:image" content="https://hoodfolio.online/hoodfolio-logo.png">
    <title>HoodFolio</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('hoodfolio-theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.remove('light', 'dark');
          if (theme === 'dark')
            document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        }
        catch (error) {
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
</head>

<body>
    <div id="app"></div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
